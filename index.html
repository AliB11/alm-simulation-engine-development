<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>شبیه‌ساز ALM | طراح محصولات تسهیلاتی امتیازی و ریسک نقدینگی بانکی</title>
    <meta
      name="description"
      content="موتور شبیه‌سازی مدیریت دارایی و بدهی (ALM) با ماتریس جریان وجوه نقد ویژه‌محور، طراحی پله‌های تسهیلات امتیازی، تحلیل نقطه واژگونی و حداکثر کسری نقدینگی"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('alm-theme');
          var d = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (d) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
