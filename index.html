<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>شبیه‌ساز ALM | طراح محصولات تسهیلاتی امتیازی و ریسک نقدینگی بانکی</title>
    <meta
      name="description"
      content="موتور شبیه‌سازی مدیریت دارایی و بدهی (ALM): ماتریس جریان وجوه نقد ویژه‌محور، صورت سود و زیان، بهینه‌یاب پله‌ها، مونت‌کارلو، سنجه‌های مقرراتی‌مانند و مقایسه سناریو"
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('alm-theme');
          var d = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (d) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
