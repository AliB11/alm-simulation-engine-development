<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>شبیه‌ساز ALM و محاسبه‌گر تسهیلات مشتری</title>
    <meta
      name="description"
      content="طراحی پله‌های تسهیلاتی با الگوهای عمومی، شبیه‌سازی ریسک نقدینگی و برآورد مبلغ وام و قسط ماهانه بر پایه مانده سپرده، مدت انتظار و دوره بازپرداخت."
    />
    <meta name="application-name" content="موتور شبیه‌سازی ALM" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fa_IR" />
    <meta property="og:title" content="موتور شبیه‌سازی مدیریت دارایی و بدهی (ALM)" />
    <meta
      property="og:description"
      content="طراح پله‌های تسهیلاتی امتیازی و شبیه‌ساز ریسک نقدینگی بر پایهٔ ماتریس جریان وجوه نقد ویژه‌محور — کاملاً در مرورگر."
    />
    <!-- آیکون درون‌خطی تا خروجی تک‌فایل برای نمایش، هیچ درخواست شبکه‌ای نداشته باشد -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M7 13l9-5 9 5v2H7v-2z' fill='%23fff'/%3E%3Crect x='9' y='16.5' width='3' height='7' rx='1' fill='%23fff'/%3E%3Crect x='14.5' y='16.5' width='3' height='7' rx='1' fill='%23c7d2fe'/%3E%3Crect x='20' y='16.5' width='3' height='7' rx='1' fill='%23fff'/%3E%3Crect x='7' y='24.5' width='18' height='2.5' rx='1.2' fill='%23fff'/%3E%3C/svg%3E"
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('alm-theme');
          var d = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (d) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 24px; font-family: Tahoma, sans-serif; line-height: 2">
        این برنامه برای شبیه‌سازی ریسک نقدینگی به JavaScript نیاز دارد. لطفاً JavaScript مرورگر را فعال کنید.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
