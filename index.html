<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>شبیه‌ساز ALM و محاسبه‌گر تسهیلات مشتری</title>
    <meta
      name="description"
      content="طراحی پله‌های تسهیلاتی با الگوهای عمومی، شبیه‌سازی ریسک نقدینگی و برآورد مبلغ وام و قسط ماهانه بر پایه مانده سپرده، مدت انتظار و دوره بازپرداخت."
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('alm-theme');
          var d = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (d) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
